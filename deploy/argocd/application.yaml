apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: science-community
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/future-alisa/ScienceCommunity.git
    targetRevision: main
    path: deploy/kubernetes
  destination:
    server: https://kubernetes.default.svc
    namespace: science-community
  ignoreDifferences:
  - group: ''
    kind: Secret
    name: science-config
    namespace: science-community
    jsonPointers:
    - /data
  - group: ''
    kind: Secret
    name: science-registry
    namespace: science-community
    jsonPointers:
    - /data
  - group: ''
    kind: Secret
    name: science-oauth-web
    namespace: science-community
    jsonPointers:
    - /data
  syncPolicy:
    syncOptions:
    - CreateNamespace=true
    - RespectIgnoreDifferences=true
