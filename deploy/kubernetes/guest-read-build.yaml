apiVersion: v1
kind: ConfigMap
metadata:
  name: science-community-guest-850dfdfa-classes
  namespace: science-community
binaryData:
  guest-classes.tgz: 
---
apiVersion: batch/v1
kind: Job
metadata:
  name: science-web-guest-850dfdfa-node
  namespace: science-community
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 2400
  template:
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      initContainers:
      - name: source
        image: alpine/git:2.47.2
        command:
        - sh
        - -ec
        - git init /workspace/source && git -C /workspace/source fetch --depth=1 https://github.com/future-alisa/ScienceCommunity.git
          "$1" && git -C /workspace/source checkout --detach FETCH_HEAD
        - checkout
        - 850dfdfa284c04ce79879e6f190f6fdeaf689eb8
        env:
        - name: HTTPS_PROXY
          value: http://192.168.1.112:4067
        - name: HTTP_PROXY
          value: http://192.168.1.112:4067
        volumeMounts:
        - name: workspace
          mountPath: /workspace
      - name: compile-web
        image: registry.kind.internal:5000/science-web@sha256:3368161ff8c3b6f07af1524a4cfe0c5d987c84e4c3f2103e0ca53e9424b81b0d
        workingDir: /workspace/source/App
        securityContext:
          runAsUser: 0
        command:
        - sh
        - -ec
        - 'npm ci --legacy-peer-deps --no-audit --no-fund

          npm run build

          mkdir -p /workspace/web-image/.next

          cp -R .next/standalone/. /workspace/web-image/

          cp -R .next/static /workspace/web-image/.next/static

          cp -R public /workspace/web-image/public

          cat > /workspace/web-image/Dockerfile <<''EOF''

          FROM registry.kind.internal:5000/science-web@sha256:3368161ff8c3b6f07af1524a4cfe0c5d987c84e4c3f2103e0ca53e9424b81b0d

          COPY --chown=node:node . /app/

          EOF

          '
        env:
        - &id002
          name: HTTP_PROXY
          value: http://192.168.1.112:4067
        - &id003
          name: HTTPS_PROXY
          value: http://192.168.1.112:4067
        - &id004
          name: NO_PROXY
          value: registry.kind.internal,localhost,127.0.0.1,.svc,.cluster.local,alisa-registry.cpolar.top
        - name: NEXT_PUBLIC_BASE_PATH
          value: /science
        - name: NEXT_PUBLIC_API_BASE_URL
          value: /science/community-api
        - name: NEXT_PUBLIC_USER_API_BASE_URL
          value: https://alisa.vip.cpolar.cn/alisa-gateway
        - name: NEXT_PUBLIC_CHAT_URL
          value: https://alisa.vip.cpolar.cn/science-chat/ws
        - name: COMMUNITY_API_PROXY_TARGET
          value: http://community:9091/community
        - name: NEXT_TELEMETRY_DISABLED
          value: '1'
        - name: NODE_OPTIONS
          value: --max-old-space-size=1400
        volumeMounts:
        - name: workspace
          mountPath: /workspace
        resources: &id001
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: '2'
            memory: 2Gi
      containers:
      - name: build
        image: ghcr.io/osscontainertools/kaniko:v1.29.0
        args:
        - --context=dir:///workspace/web-image
        - --dockerfile=/workspace/web-image/Dockerfile
        - --destination=registry.kind.internal:5000/science-web:guest-850dfdfa-node
        - --cache=false
        - --compressed-caching=false
        - --push-retry=3
        - --skip-tls-verify-registry=registry.kind.internal:5000
        volumeMounts:
        - name: workspace
          mountPath: /workspace
        - name: registry
          mountPath: /kaniko/.docker
          readOnly: true
        resources: *id001
        env:
        - *id002
        - *id003
        - *id004
      volumes:
      - name: workspace
        emptyDir:
          sizeLimit: 4Gi
      - name: registry
        secret:
          secretName: science-registry
          items:
          - key: .dockerconfigjson
            path: config.json
      dnsPolicy: Default
      imagePullSecrets:
      - name: science-registry
---
apiVersion: batch/v1
kind: Job
metadata:
  name: science-community-guest-850dfdfa-classes
  namespace: science-community
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 2400
  template:
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      initContainers:
      - name: copy-runtime
        image: registry.kind.internal:5000/science-community@sha256:1cabbeb94e1988ef90eae37d8162a2d8f584c17b05a8f8ca38dcc730205cd64f
        securityContext:
          runAsUser: 0
        command:
        - sh
        - -ec
        - mkdir -p /workspace/backend-image && cp /app/science.jar /workspace/backend-image/science.jar
        volumeMounts:
        - &id001
          name: workspace
          mountPath: /workspace
      - name: update-jar
        image: maven:3.9.9-eclipse-temurin-17
        command:
        - sh
        - -ec
        - 'echo ''47a2f859d5bec1f4a2cd56aeea768786c118bfe526f4aeef663c9046ee39f2dc  /bundle/guest-classes.tgz''
          | sha256sum -c

          mkdir -p /workspace/overlay

          tar -xzf /bundle/guest-classes.tgz -C /workspace/overlay

          jar --update --file /workspace/backend-image/science.jar -C /workspace/overlay
          BOOT-INF/classes

          cat > /workspace/backend-image/Dockerfile <<''EOF''

          FROM registry.kind.internal:5000/science-community@sha256:1cabbeb94e1988ef90eae37d8162a2d8f584c17b05a8f8ca38dcc730205cd64f

          COPY science.jar /app/science.jar

          EOF

          '
        volumeMounts:
        - *id001
        - name: bundle
          mountPath: /bundle
          readOnly: true
      containers:
      - name: build
        image: ghcr.io/osscontainertools/kaniko:v1.29.0
        args:
        - --context=dir:///workspace/backend-image
        - --dockerfile=/workspace/backend-image/Dockerfile
        - --destination=registry.kind.internal:5000/science-community:guest-850dfdfa-classes
        - --cache=false
        - --compressed-caching=false
        - --push-retry=3
        - --skip-tls-verify-registry=registry.kind.internal:5000
        volumeMounts:
        - name: workspace
          mountPath: /workspace
        - name: registry
          mountPath: /kaniko/.docker
          readOnly: true
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: '2'
            memory: 2Gi
        env:
        - name: HTTP_PROXY
          value: http://192.168.1.112:4067
        - name: HTTPS_PROXY
          value: http://192.168.1.112:4067
        - name: NO_PROXY
          value: registry.kind.internal,localhost,127.0.0.1,.svc,.cluster.local,alisa-registry.cpolar.top
      volumes:
      - name: workspace
        emptyDir:
          sizeLimit: 4Gi
      - name: registry
        secret:
          secretName: science-registry
          items:
          - key: .dockerconfigjson
            path: config.json
      - name: bundle
        configMap:
          name: science-community-guest-850dfdfa-classes
      dnsPolicy: Default
      imagePullSecrets:
      - name: science-registry
