apiVersion: batch/v1
kind: Job
metadata:
  name: science-web-guest-850dfdfa-node
  namespace: science-community
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 2400
  template:
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      initContainers:
      - name: source
        image: alpine/git:2.47.2
        command:
        - sh
        - -ec
        - git init /workspace/source && git -C /workspace/source fetch --depth=1 https://github.com/future-alisa/ScienceCommunity.git
          "$1" && git -C /workspace/source checkout --detach FETCH_HEAD
        - checkout
        - 850dfdfa284c04ce79879e6f190f6fdeaf689eb8
        env:
        - name: HTTPS_PROXY
          value: http://192.168.1.112:4067
        - name: HTTP_PROXY
          value: http://192.168.1.112:4067
        volumeMounts:
        - name: workspace
          mountPath: /workspace
      - name: compile-web
        image: registry.kind.internal:5000/science-web@sha256:3368161ff8c3b6f07af1524a4cfe0c5d987c84e4c3f2103e0ca53e9424b81b0d
        workingDir: /workspace/source/App
        securityContext:
          runAsUser: 0
        command:
        - sh
        - -ec
        - 'npm ci --legacy-peer-deps --no-audit --no-fund

          npm run build

          mkdir -p /workspace/web-image/.next

          cp -R .next/standalone/. /workspace/web-image/

          cp -R .next/static /workspace/web-image/.next/static

          cp -R public /workspace/web-image/public

          cat > /workspace/web-image/Dockerfile <<''EOF''

          FROM registry.kind.internal:5000/science-web@sha256:3368161ff8c3b6f07af1524a4cfe0c5d987c84e4c3f2103e0ca53e9424b81b0d

          COPY --chown=node:node . /app/

          EOF

          '
        env:
        - &id002
          name: HTTP_PROXY
          value: http://192.168.1.112:4067
        - &id003
          name: HTTPS_PROXY
          value: http://192.168.1.112:4067
        - &id004
          name: NO_PROXY
          value: registry.kind.internal,localhost,127.0.0.1,.svc,.cluster.local,alisa-registry.cpolar.top
        - name: NEXT_PUBLIC_BASE_PATH
          value: /science
        - name: NEXT_PUBLIC_API_BASE_URL
          value: /science/community-api
        - name: NEXT_PUBLIC_USER_API_BASE_URL
          value: https://alisa.vip.cpolar.cn/alisa-gateway
        - name: NEXT_PUBLIC_CHAT_URL
          value: https://alisa.vip.cpolar.cn/science-chat/ws
        - name: COMMUNITY_API_PROXY_TARGET
          value: http://community:9091/community
        - name: NEXT_TELEMETRY_DISABLED
          value: '1'
        - name: NODE_OPTIONS
          value: --max-old-space-size=1400
        volumeMounts:
        - name: workspace
          mountPath: /workspace
        resources: &id001
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: '2'
            memory: 2Gi
      containers:
      - name: build
        image: ghcr.io/osscontainertools/kaniko:v1.29.0
        args:
        - --context=dir:///workspace/web-image
        - --dockerfile=/workspace/web-image/Dockerfile
        - --destination=registry.kind.internal:5000/science-web:guest-850dfdfa-node
        - --cache=false
        - --compressed-caching=false
        - --push-retry=3
        - --skip-tls-verify-registry=registry.kind.internal:5000
        volumeMounts:
        - name: workspace
          mountPath: /workspace
        - name: registry
          mountPath: /kaniko/.docker
          readOnly: true
        resources: *id001
        env:
        - *id002
        - *id003
        - *id004
      volumes:
      - name: workspace
        emptyDir:
          sizeLimit: 4Gi
      - name: registry
        secret:
          secretName: science-registry
          items:
          - key: .dockerconfigjson
            path: config.json
      dnsPolicy: Default
      imagePullSecrets:
      - name: science-registry
---
apiVersion: batch/v1
kind: Job
metadata:
  name: science-community-guest-850dfdfa-internal
  namespace: science-community
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 2400
  template:
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      initContainers:
      - name: source
        image: alpine/git:2.47.2
        command:
        - sh
        - -ec
        - 'git init /workspace/source && git -C /workspace/source fetch --depth=1
          https://github.com/future-alisa/ScienceCommunity.git "$1" && git -C /workspace/source
          checkout --detach FETCH_HEAD

          git init /workspace/alisa-cloud

          git -C /workspace/alisa-cloud fetch --depth=1 https://github.com/future-alisa/alisa-cloud.git
          69f3d526a441fbdf533404fae4514e347af50ff8

          git -C /workspace/alisa-cloud checkout --detach FETCH_HEAD

          '
        - checkout
        - 850dfdfa284c04ce79879e6f190f6fdeaf689eb8
        env:
        - name: HTTPS_PROXY
          value: http://192.168.1.112:4067
        - name: HTTP_PROXY
          value: http://192.168.1.112:4067
        volumeMounts:
        - name: workspace
          mountPath: /workspace
      - name: package
        image: maven:3.9.9-eclipse-temurin-17
        command:
        - sh
        - -ec
        - '

          cat > /workspace/maven-settings.xml <<''EOF''

          <settings><proxies><proxy><id>build-proxy</id><active>true</active><protocol>http</protocol><host>192.168.1.112</host><port>4067</port></proxy></proxies></settings>

          EOF

          mvn -s /workspace/maven-settings.xml -f /workspace/alisa-cloud/pom.xml -pl
          alisa-common -am -DskipTests -B -ntp install

          mvn -s /workspace/maven-settings.xml -f /workspace/source/science_community/pom.xml
          -pl community_service -am -DskipTests -B -ntp package

          mkdir -p /workspace/backend-image

          cp /workspace/source/science_community/packages/community_service-1.0-SNAPSHOT.jar
          /workspace/backend-image/science.jar

          cat > /workspace/backend-image/Dockerfile <<''EOF''

          FROM eclipse-temurin:17-jre

          WORKDIR /app

          COPY science.jar /app/science.jar

          ENTRYPOINT ["java", "-jar", "/app/science.jar"]

          EOF

          '
        volumeMounts:
        - name: workspace
          mountPath: /workspace
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: '2'
            memory: 2Gi
      containers:
      - name: build
        image: ghcr.io/osscontainertools/kaniko:v1.29.0
        args:
        - --context=dir:///workspace/backend-image
        - --dockerfile=/workspace/backend-image/Dockerfile
        - --destination=registry.kind.internal:5000/science-community:guest-850dfdfa
        - --cache=false
        - --compressed-caching=false
        - --push-retry=3
        - --skip-tls-verify-registry=registry.kind.internal:5000
        volumeMounts:
        - name: workspace
          mountPath: /workspace
        - name: registry
          mountPath: /kaniko/.docker
          readOnly: true
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: '2'
            memory: 2Gi
        env:
        - name: HTTP_PROXY
          value: http://192.168.1.112:4067
        - name: HTTPS_PROXY
          value: http://192.168.1.112:4067
        - name: NO_PROXY
          value: registry.kind.internal,localhost,127.0.0.1,.svc,.cluster.local,alisa-registry.cpolar.top
      volumes:
      - name: workspace
        emptyDir:
          sizeLimit: 4Gi
      - name: registry
        secret:
          secretName: science-registry
          items:
          - key: .dockerconfigjson
            path: config.json
      dnsPolicy: Default
