            name: science-config
        command:
        - java
        args:
        - -XX:MaxRAMPercentage=70
        - -jar
        - /app/science.jar
  strategy:
    type: Recreate
---
apiVersion: v1
kind: Service
metadata:
  name: transfer
  namespace: science-community
