apiVersion: v1
kind: Namespace
metadata:
  name: science-community
---
apiVersion: v1
kind: Secret
metadata:
  name: science-config
  namespace: science-community
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
type: Opaque
data: {}
---
apiVersion: v1
kind: Secret
metadata:
  name: science-registry
  namespace: science-community
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: eyJhdXRocyI6e319
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: community
  namespace: science-community
spec:
  replicas: 1
  selector:
    matchLabels: &id001
      app.kubernetes.io/name: science-community
  template:
    metadata:
      labels: *id001
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
      - name: science-registry
      containers:
      - name: community
        image: registry.kind.internal:5000/science-community:src-6fec17f@sha256:9ca907f7fe8f0155c7f39eb723ebfe59d1003b296f0fef0f8569d21d0ed8079d
        ports:
        - name: http
          containerPort: 9091
        env:
        - name: HOST
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: '2'
            memory: 1Gi
        startupProbe:
          httpGet:
            path: /community/community/getAll
            port: http
          failureThreshold: 90
          periodSeconds: 5
        readinessProbe:
          httpGet:
            path: /community/community/getAll
            port: http
          periodSeconds: 10
        envFrom:
        - secretRef:
            name: science-config
        command:
        - java
        args:
        - -XX:MaxRAMPercentage=70
        - -jar
        - /app/science.jar
  strategy:
    type: Recreate
---
apiVersion: v1
kind: Service
metadata:
  name: community
  namespace: science-community
spec:
  selector:
    app.kubernetes.io/name: science-community
  ports:
  - name: http
    port: 9091
    targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: transfer
  namespace: science-community
spec:
  replicas: 1
  selector:
    matchLabels: &id001
      app.kubernetes.io/name: science-transfer
  template:
    metadata:
      labels: *id001
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
      - name: science-registry
      containers:
      - name: transfer
        image: registry.kind.internal:5000/science-transfer:release-20261107@sha256:47e28fb428e44f2dd68491ada5b28d72fbdf1a5801da56c9e9056f6dddc8a30d
        ports:
        - name: http
          containerPort: 9092
        env:
        - name: HOST
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: '2'
            memory: 1Gi
        startupProbe:
