---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: science-community
spec:
  replicas: 1
  selector:
    matchLabels: &id001
      app.kubernetes.io/name: science-web
  template:
    metadata:
      labels: *id001
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
      - name: science-registry
      containers:
      - name: web
        image: registry.kind.internal:5000/science-web:release-20261107@sha256:a1e2eb672fa0064022bc748c4c21c6da1567a2fe0b3f7a4b8c9ef4ddc3a636a1
        ports:
        - name: http
          containerPort: 3000
        envFrom:
        - secretRef:
            name: science-oauth-web
            optional: true
        env:
        - name: HOSTNAME
          value: 0.0.0.0
        - name: PORT
          value: '3000'
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: '2'
            memory: 1Gi
        startupProbe:
          httpGet:
            path: /science
            port: http
          failureThreshold: 90
          periodSeconds: 5
        readinessProbe:
          httpGet:
            path: /science
            port: http
          periodSeconds: 10
  strategy:
    type: Recreate
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: science-community
spec:
  selector:
    app.kubernetes.io/name: science-web
  ports:
  - name: http
    port: 3000
    targetPort: http
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: science
  namespace: science-community
spec:
  parentRefs:
  - name: traefik-gateway
    namespace: traefik
  hostnames:
  - alisa.vip.cpolar.cn
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /science
    backendRefs:
    - name: web
      port: 3000
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: science-chat
  namespace: science-community
spec:
  parentRefs:
  - name: traefik-gateway
    namespace: traefik
  hostnames:
  - alisa.vip.cpolar.cn
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /science-chat
    backendRefs:
    - name: transfer
      port: 9092
    filters:
    - type: URLRewrite
      urlRewrite:
        path:
          type: ReplacePrefixMatch
          replacePrefixMatch: /
