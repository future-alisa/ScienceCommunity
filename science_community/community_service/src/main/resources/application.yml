server:
  port: 9091
  servlet:
    context-path: /community
springdoc:
  swagger-ui:
    path: /swagger-ui.html
spring:
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB
  sql:
    init:
      mode: always
      schema-locations: classpath:db/channel-messages.sql
  application:
    name: community-service
  config:
    import:
      - optional:file:./community_service/.env[.properties]
  profiles:
    active: dev

